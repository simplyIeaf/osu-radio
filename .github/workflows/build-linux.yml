name: Build Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x linux/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-linux-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install packaging tools and FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Download appimagetool
        run: |
          sudo mkdir -p /opt/appimage
          sudo curl -L -o /opt/appimage/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /opt/appimage/appimagetool

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep VERSION_NAME linux/version.properties | cut -d'=' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Linux distribution
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cd linux && ./gradlew packageDistributionForCurrentOS --no-daemon --stacktrace

      # Compose Multiplatform's AppImage target is jpackage's unpacked app-image
      # directory, so wrap it in an AppDir and pack it into a single .AppImage.
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euxo pipefail
          APP_NAME=osu-radio
          VERSION=${{ steps.version.outputs.version_name }}
          mkdir -p out

          REAL_APPIMAGE=$(find linux/build -name "*.AppImage" -type f | head -1 || true)
          if [ -n "$REAL_APPIMAGE" ]; then
            cp "$REAL_APPIMAGE" "out/$APP_NAME-$VERSION.AppImage"
            ls -la out/
            exit 0
          fi

          APP_DIR="linux/build/compose/binaries/main/app/$APP_NAME"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::jpackage app-image not found at $APP_DIR" >&2
            exit 1
          fi

          rm -rf "$APP_NAME.AppDir"
          mkdir -p "$APP_NAME.AppDir/usr"
          cp -a "$APP_DIR/." "$APP_NAME.AppDir/usr/"

          cat > "$APP_NAME.AppDir/$APP_NAME.desktop" <<EOF
          [Desktop Entry]
          Name=osu!radio
          Exec=$APP_NAME
          Icon=$APP_NAME
          Type=Application
          Categories=Audio;Music;
          Comment=Play osu! beatmap songs
          EOF

          cat > "$APP_NAME.AppDir/AppRun" <<'EOF'
          #!/bin/sh
          SELF_DIR=$(dirname "$(readlink -f "$0")")
          export APPDIR="$SELF_DIR"
          export PATH="$SELF_DIR/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$SELF_DIR/usr/lib:$LD_LIBRARY_PATH"
          exec "$SELF_DIR/usr/bin/osu-radio" "$@"
          EOF
          chmod +x "$APP_NAME.AppDir/AppRun" "$APP_NAME.AppDir/usr/bin/osu-radio"

          ICON=$(find "$APP_NAME.AppDir" -maxdepth 4 -name "$APP_NAME.png" | head -1 || true)
          if [ -z "$ICON" ]; then
            ICON="linux/src/main/resources/ic_launcher.png"
          fi
          cp "$ICON" "$APP_NAME.AppDir/$APP_NAME.png"

          /opt/appimage/appimagetool -n "$APP_NAME.AppDir" "out/$APP_NAME-$VERSION.AppImage"
          ls -la out/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          path: out/osu-radio-${{ steps.version.outputs.version_name }}.AppImage
          archive: false
          retention-days: 30

      - name: Summarize build
        run: |
          echo "### Linux build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **AppImage**: \`out/osu-radio-${{ steps.version.outputs.version_name }}.AppImage\`" >> "$GITHUB_STEP_SUMMARY"
