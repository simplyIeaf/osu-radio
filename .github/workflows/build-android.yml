name: Build Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          rm -rf $ANDROID_HOME/platforms/android-35
          rm -rf $ANDROID_HOME/build-tools/35.0.0
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep VERSION_NAME version.properties | cut -d'=' -f2)
          APP_VERSION=$(grep APP_VERSION version.properties | cut -d'=' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/osu-radio-release-${{ steps.version.outputs.app_version }}-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: out/osu-radio-release-${{ steps.version.outputs.app_version }}-${{ github.sha }}.apk
          archive: false
          retention-days: 30

      - name: Summarize build
        run: |
          echo "### Android build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK**: \`out/osu-radio-release-${{ steps.version.outputs.app_version }}-${{ github.sha }}.apk\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove decoded keystore
        if: always()
        run: rm -f keystore/release.keystore
